post:
  tags:
    - Contacts
  summary: Create new contact
  description: Створити новий контакт
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            email:
              type: string
              example: johndoe@example.com
            phoneNumber:
              type: string
              example: +380501234567
            isFavourite:
              type: boolean
              example: false
            contactType:
              type: string
              example: personal
            photo:
              type: string
              format: binary
  responses:
    '201':
      description: Контакт успішно створено
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully created a contact!
              data:
                $ref: '../../../components/schemas/contact.yaml'
    '401':
      $ref: '../../../components/responses/401.yaml'
