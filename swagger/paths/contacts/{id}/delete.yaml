delete:
  tags:
    - Contacts
  summary: Видалити контакт
  operationId: deleteContact
  description: >
    Видаляє контакт за його унікальним ID.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Контакт видалений
    '404':
      description: Контакт не знайдено
    '401':
      description: Неавторизований
