patch:
  tags:
    - Contacts
  summary: Оновити контакт
  operationId: updateContact
  description: >
    Оновлює дані існуючого контакта. Можна завантажити нове фото.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Контакт оновлений
    '400':
      description: Невірні дані
    '404':
      description: Контакт не знайдено
    '401':
      description: Неавторизований
