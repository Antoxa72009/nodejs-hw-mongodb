patch:
  summary: Update contact by id
  description: Оновити інформацію про контакт за його ID
  tags:
    - Contacts
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
      description: ID контакту, який потрібно оновити
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            email:
              type: string
              example: johndoe@example.com
            phoneNumber:
              type: string
              example: +380501234567
            favorite:
              type: boolean
              example: true
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Контакт успішно оновлено
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully updated contact!
              data:
                $ref: '../../../../components/schemas/contact.yaml'
    '401':
      $ref: '../../../../components/responses/401.yaml'
    '404':
      $ref: '../../../../components/responses/404.yaml'
